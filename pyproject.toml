[project]
name = "megasast"
version = "0.1.4"
description = "Simple SAST tool for large monorepos with valid SARIF output"
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "Matt Stanchek", email = "matt@stanchek.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "tree-sitter>=0.26.0",
  "tree-sitter-language-pack>=1.6",
  "pathspec>=0.12",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/radigence/megasast"
Repository = "https://github.com/radigence/megasast"
Issues = "https://github.com/radigence/megasast/issues"
Changelog = "https://github.com/radigence/megasast/blob/main/CHANGELOG.md"

[project.scripts]
megasast = "megasast.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pyflakes + pycodestyle errors stay fast and low-noise; the codebase is
# deliberately comment-heavy, so style churn (E5, formatting) is not selected.
select = ["E4", "E7", "E9", "F"]

# Deliberately-shaped vulnerability fixtures order calls before imports to
# exercise call-detection at arbitrary positions; exempt them from import
# position checks without touching their content.
[tool.ruff.lint.per-file-ignores]
"tests/fixtures/*" = ["E402"]
