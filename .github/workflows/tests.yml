name: tests

on:
  push:
  pull_request:

# Read the repo, nothing more.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        # Must run from the repo root: tests read README.md and
        # tests/fixtures via relative paths.
        run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (ruff comes from the dev extras)
        run: pip install -e .[dev]
      - name: Ruff
        run: ruff check src tests scripts

  # The testbed corpus and RULES.md are generated from the rule registry.
  # If a rules change was committed without regenerating them, fail here
  # instead of shipping a stale catalog with tests that quietly still pass.
  generated-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Regenerate generated files
        run: |
          python scripts/generate_rules_md.py
          python scripts/generate_testbed.py
      - name: Fail on drift
        run: git diff --exit-code
